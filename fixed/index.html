<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nordaloom — wool sweaters, cardigans, hats, scarves, socks and blankets, knitted in small batches in Latvia." />
    <meta name="theme-color" content="#f7f3ec" />
    <script>
      // Light or dark before anything is drawn (no flash): the customer's choice, or the phone's.
      (function () {
        try {
          var pref = localStorage.getItem("nordaloom.theme") || "system"
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#1b1916" : "#f7f3ec")
        } catch (e) {}
      })()
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nordaloom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Nordaloom — Knitwear from Latvia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
